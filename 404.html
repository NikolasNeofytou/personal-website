<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F5F4EF">
    <!-- GitHub Pages serves this page at any missing path, so every URL resolves from the site root. -->
    <base href="/">
    <title>No such place — Nikolas Neofytou</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <style>
        @font-face { font-family: 'Instrument Serif'; font-display: swap; src: url('assets/fonts/instrument-serif.woff2') format('woff2'); }
        @font-face { font-family: 'Instrument Serif'; font-style: italic; font-display: swap; src: url('assets/fonts/instrument-serif-italic.woff2') format('woff2'); }
        @font-face { font-family: 'Inter'; font-weight: 300 600; font-display: swap; src: url('assets/fonts/inter-var.woff2') format('woff2'); }
        @font-face { font-family: 'DM Mono'; font-weight: 400; font-display: swap; src: url('assets/fonts/dm-mono-400.woff2') format('woff2'); }
        :root {
            --bg: #F5F4EF; --text: #1A1A17; --text-dim: #494841; --text-faint: #66645A;
            --accent: #1F3BFF; --line: rgba(26, 26, 23, 0.12); --line-strong: rgba(26, 26, 23, 0.20);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.5rem;
            background: var(--bg); color: var(--text);
            font: 400 1rem/1.6 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        main { width: 100%; max-width: 40rem; }
        .plate { margin: 0; }
        .plate img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; border: 1px solid var(--line-strong); background: #D9B985; }
        .plate figcaption { display: flex; justify-content: space-between; gap: 1rem; margin: 0.6rem 0 2rem; font: 400 0.75rem/1.4 'DM Mono', 'Courier New', monospace; letter-spacing: 0.04em; color: var(--text-faint); }
        .plate figcaption b { color: var(--accent); font-weight: 400; }
        h1 { margin: 0 0 0.6rem; font: 400 clamp(2.4rem, 7vw, 3.4rem)/1.05 'Instrument Serif', Georgia, serif; letter-spacing: -0.01em; }
        h1 em { font-style: italic; color: var(--accent); }
        p { margin: 0 0 1.6rem; color: var(--text-dim); }
        nav { display: flex; flex-wrap: wrap; gap: 0.6rem 1.4rem; font: 400 0.85rem/1.4 'DM Mono', 'Courier New', monospace; }
        a { color: var(--accent); text-underline-offset: 0.2em; }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <figure class="plate">
            <picture>
                <source type="image/avif" srcset="assets/town/road-720.avif 720w, assets/town/road-1200.avif 1200w" sizes="(max-width: 43rem) calc(100vw - 3rem), 40rem">
                <img src="assets/town/road-1200.webp" srcset="assets/town/road-720.webp 720w, assets/town/road-1200.webp 1200w" sizes="(max-width: 43rem) calc(100vw - 3rem), 40rem"
                     width="1200" height="800" fetchpriority="high"
                     alt="A painted stone road winding down past milestones to a small harbour at golden hour, with a lighthouse and a moored boat.">
            </picture>
            <figcaption><span><b>Plate 404</b> · The road down to the harbour</span></figcaption>
        </figure>
        <h1>No such place <em>in&nbsp;this&nbsp;town</em>.</h1>
        <p>The link may be old, or the address mistyped. Every place there is starts from the front page.</p>
        <nav aria-label="Where to go">
            <a href="./">Back to the town</a>
            <a href="./#work">Selected work</a>
            <a href="./#contact">Contact</a>
        </nav>
    </main>
</body>
</html>
