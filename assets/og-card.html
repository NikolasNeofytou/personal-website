<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Source for og-town.jpg (1200×630). Serve the site locally, render with
     headless Chrome to PNG (--headless=new --hide-scrollbars --window-size=1200,630
     --virtual-time-budget=6000 --screenshot=og.png <url>/assets/og-card.html),
     then convert to JPEG q90. Rename the output if you change it, so social caches refetch. -->
<style>
  @font-face { font-family: 'Instrument Serif'; src: url('fonts/instrument-serif.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 300 600; src: url('fonts/inter-var.woff2') format('woff2'); }
  @font-face { font-family: 'DM Mono'; font-weight: 400; src: url('fonts/dm-mono-400.woff2') format('woff2'); }
  @font-face { font-family: 'DM Mono'; font-weight: 500; src: url('fonts/dm-mono-500.woff2') format('woff2'); }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(rgba(26,26,23,0.045) 1px, transparent 1px) 0 0 / 42px 42px,
      linear-gradient(90deg, rgba(26,26,23,0.045) 1px, transparent 1px) 0 0 / 42px 42px,
      #F5F4EF;
    color: #1A1A17;
    font-family: 'Inter', -apple-system, sans-serif;
  }
  .left {
    position: absolute;
    left: 72px; top: 72px; bottom: 64px;
    width: 470px;
    display: flex; flex-direction: column;
  }
  .tag {
    font-family: 'DM Mono', monospace;
    font-size: 17px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #1F3BFF;
    display: flex; align-items: center; gap: 14px;
  }
  .tag::after {
    content: ''; width: 48px; height: 1px;
    background: rgba(31,59,255,0.35);
  }
  .name {
    margin-top: 34px;
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 104px; line-height: 0.95; font-weight: 400;
    letter-spacing: -0.5px;
  }
  .pitch {
    margin-top: 30px;
    font-size: 30px; line-height: 1.3; font-weight: 400;
    color: #1A1A17;
  }
  .meta {
    margin-top: auto;
    font-family: 'DM Mono', monospace;
    font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #66645A;
    display: flex; flex-direction: column; gap: 12px;
  }
  .url { text-transform: none; letter-spacing: 0.02em; white-space: nowrap; }
  .status { display: flex; align-items: center; gap: 10px; color: #494841; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #2FBF71; }
  .right {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 588px;
    background: #0E0F12;
    border-left: 1px solid rgba(26,26,23,0.20);
  }
  .right img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    display: block;
  }
  .corner {
    position: absolute; top: 28px; right: 28px;
    width: 22px; height: 22px;
    border-top: 1.5px solid #8C9BFF;
    border-right: 1.5px solid #8C9BFF;
  }
  .right::after {
    content: ''; position: absolute; inset: auto 0 0 0; height: 140px;
    background: linear-gradient(to top, rgba(20, 14, 6, 0.62), rgba(20, 14, 6, 0));
  }
  .fig {
    position: absolute; left: 28px; bottom: 26px; z-index: 1;
    font-family: 'DM Mono', monospace;
    font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(245,244,239,0.72);
  }
  .fig b { color: #8C9BFF; font-weight: 500; margin-right: 10px; }
</style>
</head>
<body>
  <div class="left">
    <div class="tag">Electrical &amp; Computer Engineer</div>
    <div class="name">Nikolas<br>Neofytou</div>
    <div class="pitch">I build software for real places.</div>
    <div class="meta">
      <div class="status"><span class="dot"></span>Available for freelance</div>
      <div class="url">nikolasneofytou.com</div>
    </div>
  </div>
  <div class="right">
    <img src="og-keyframe.jpg" alt="">
    <div class="corner"></div>
    <div class="fig"><b>Plate</b>The town at golden hour</div>
  </div>
</body>
</html>
