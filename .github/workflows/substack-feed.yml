# Keeps assets/substack.json (the Writing section's post list) in sync with
# the Substack RSS feed, so the page never depends on a third-party proxy.
# Commits only when the posts change, then asks GitHub Pages to rebuild
# (pushes made with GITHUB_TOKEN don't reliably trigger a Pages build).
name: Substack feed snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: substack-feed
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot feed
        run: python3 scripts/fetch-substack.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- assets/substack.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/substack.json
          git commit -m "Update Substack feed snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
